{% extends "base.html" %}
{% block title %}Sign in · Vid2Mp3{% endblock %}
{% block content %}
<section class="card">
  <h1>Welcome back</h1>
  <p class="sub">Sign in to turn your videos into audio.</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" value="{{ email or '' }}" placeholder="you@example.com" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
    <button class="btn" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
